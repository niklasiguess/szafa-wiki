<style>
/* Layout: eine Spalte fürs Handy; Outfits als gelegte Collage auf weicher Bühne; schwebende Tab-Leiste; Niklas' Sprechblase kehrt wieder */
:root{
  --bg:#FAF3F0; --card:#FFFDFB; --ink:#2E1F27; --muted:#8C7480; --line:#EEDFDB;
  --rose:#BF4D69; --rose-soft:#F5DEE2; --stage-a:#FBE9D8; --stage-b:#F6D7DE; --on-rose:#FFF9F7; --tile:#F6ECE8;
  --shadow:0 10px 30px rgba(110,50,70,.10); --shadow-s:0 3px 10px rgba(110,50,70,.08);
  --display:"Instrument Serif","Cormorant Garamond",Georgia,serif;
  --body:"Manrope","Avenir Next","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1E151A; --card:#2A1E25; --ink:#F7EAEC; --muted:#B79AA5; --line:#3F2D36;
  --rose:#EE8FA5; --rose-soft:#4A2833; --stage-a:#3A2A2A; --stage-b:#46293A; --on-rose:#2A1218; --tile:#33252D;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-s:0 3px 10px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1E151A; --card:#2A1E25; --ink:#F7EAEC; --muted:#B79AA5; --line:#3F2D36;
  --rose:#EE8FA5; --rose-soft:#4A2833; --stage-a:#3A2A2A; --stage-b:#46293A; --on-rose:#2A1218; --tile:#33252D;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-s:0 3px 10px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:14px 120px;max-width:560px;margin:0 auto;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.1}
h3{font-family:var(--body);font-weight:700;font-size:15px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--display);font-size:25px;letter-spacing:.01em}
.brand i{color:var(--rose)}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-s);display:grid;place-items:center;font-size:15px;color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.01em;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow-s)}
.btn.small{padding:8px 14px;font-size:12.5px}
.btn:disabled{opacity:.45}
.btn.danger{background:none;color:var(--rose);box-shadow:inset 0 0 0 1.5px var(--rose)}
/* Niklas */
.niklas{display:flex;gap:12px;align-items:flex-end}
.niklas>svg{flex:none;width:58px;height:58px;border-radius:50%;box-shadow:var(--shadow-s)}
.bubble{background:var(--card);box-shadow:var(--shadow-s);border-radius:22px 22px 22px 6px;padding:13px 16px;min-width:0;flex:1}
.bubble .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:700;display:block;margin-bottom:3px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
/* Bühne und Collage */
.look{background:linear-gradient(160deg,var(--stage-a),var(--stage-b));border-radius:32px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.collage{position:relative;aspect-ratio:4/5;width:100%;max-width:100%}
.collage.sm{aspect-ratio:1/1.15}
.cz{position:absolute;aspect-ratio:3/4;filter:drop-shadow(0 8px 12px rgba(90,40,55,.22));animation:drop .5s cubic-bezier(.2,.9,.3,1.2) backwards}
.cz:nth-child(2){animation-delay:.06s}.cz:nth-child(3){animation-delay:.12s}.cz:nth-child(4){animation-delay:.18s}.cz:nth-child(5){animation-delay:.24s}
@keyframes drop{from{opacity:0;translate:0 -14px}}
.cz svg{width:100%;height:100%}
.cz.shot{background:var(--card);padding:4px;border-radius:14px}
.cz.shot img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
@media (prefers-reduced-motion:reduce){.pulse,.cz{animation:none}.btn{transition:none}}
/* Teile */
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
@media (min-width:430px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;min-width:0}
.tile .pic{position:relative;display:block;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:var(--tile)}
.tile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pic.ph svg{width:100%;height:100%;padding:18%}
.tile .cap{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tile .tag{position:absolute;top:8px;left:8px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--card);color:var(--muted);padding:3px 7px;border-radius:99px}
.tile .heart{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--card);color:var(--rose);display:grid;place-items:center;font-size:12px}
.tile.sel .pic{box-shadow:inset 0 0 0 3px var(--rose)}
.tile.sel .pic::after{content:"✓";position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:50%;background:var(--rose);color:var(--on-rose);display:grid;place-items:center;font-size:13px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-s);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);box-shadow:var(--shadow-s);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px}
.empty{text-align:center;padding:36px 16px;border-radius:26px;background:var(--tile);color:var(--muted)}
/* Outfits */
.ogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
.ocard{display:flex;flex-direction:column;gap:8px;min-width:0}
.ocard .collage{background:linear-gradient(160deg,var(--stage-a),var(--stage-b));border-radius:24px}
.oname{text-align:left;display:flex;flex-direction:column;padding:0 4px;min-width:0}
.oname b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oname span{font-size:12px;color:var(--muted)}
/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-variant-numeric:tabular-nums}
.cal span{text-align:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:2px}
.day{aspect-ratio:1;border-radius:50%;font-size:13.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card)}
.day.today{background:var(--ink);color:var(--bg)}
.day i{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--rose)}
.day i.worn{background:var(--rose)}
/* Zahlen */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{background:var(--card);box-shadow:var(--shadow-s);border-radius:22px;padding:14px 8px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.num b{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;display:block;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:76px 1fr 24px;gap:10px;align-items:center;font-size:13px}
.bar div{height:8px;border-radius:99px;background:var(--rose-soft);overflow:hidden}
.bar div u{display:block;height:100%;background:var(--rose);border-radius:99px}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
nav div{display:flex;width:100%;max-width:430px;background:var(--card);border-radius:999px;padding:6px;box-shadow:var(--shadow);pointer-events:auto}
nav button{flex:1;padding:7px 2px 6px;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:999px}
nav button svg{width:22px;height:22px}
nav button.on{background:var(--ink);color:var(--bg)}
/* Sheet */
.veil{position:fixed;inset:0;background:rgba(40,20,28,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:32px 32px 0 0;animation:up .28s cubic-bezier(.2,.8,.3,1);
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
label{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=password],select{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);width:100%}
input:focus,select:focus{border-color:var(--rose);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{aspect-ratio:4/3;border-radius:26px;background:var(--tile);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer}
.photo span{display:flex;flex-direction:column;align-items:center;gap:8px}
.photo span svg{width:34px;height:34px}
.photo img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:700;z-index:40;max-width:90%;box-shadow:var(--shadow)}
.tour{align-items:center;padding:22px}
.tour .sheet{border-radius:32px;text-align:center;align-items:center;padding-top:30px}
.tour .sheet>svg{width:128px;height:128px}
.tour h2{font-size:34px}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--rose);width:20px;border-radius:99px}
</style>

<div id="app"></div>
<nav aria-label="Bereiche"><div id="nav"></div></nav>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=()=>dkey(new Date());
const CATS=["Oberteil","Unterteil","Kleid","Jacke","Schuhe","Accessoire"];
const SHAPE={Oberteil:"M16 6l-12 6 4 9 6-3v24h20V18l6 3 4-9-12-6c-1 4-4 6-8 6s-7-2-8-6z",Unterteil:"M13 5h22l3 38H27l-3-24-3 24H10z",Kleid:"M18 4l-2 8 4 6-9 26h26l-9-26 4-6-2-8h-3c0 3-2 5-3 5s-3-2-3-5z",Jacke:"M17 5L6 11 4 41h8V22l2 21h9V12zM31 5l11 6 2 30h-8V22l-2 21h-9V12z",Schuhe:"M4 30c0-6 2-12 6-12 2 4 6 6 10 6l14 4c6 1 10 3 10 8v2H4z",Accessoire:"M10 20h28l3 22H7zM17 20v-5a7 7 0 0114 0v5h-3v-5a4 4 0 00-8 0v5z"};
const SLOT={Jacke:[3,3,46,-5],Oberteil:[50,5,44,4],Kleid:[28,10,44,2],Unterteil:[8,45,40,-3],Accessoire:[58,40,26,-8],Schuhe:[56,63,30,6]};
const ico=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const COLORS={Schwarz:"#2b2b2e",Weiß:"#f4f1ec",Beige:"#dccbb0",Braun:"#8a6248",Grau:"#a3a3a8",Blau:"#5b7fb5",Rosa:"#eaa9b8",Rot:"#c94a4a",Grün:"#7fa07a",Gelb:"#ecd06a",Lila:"#a488c7",Bunt:"#e9b48c"};
const SEASONS=["Ganzjährig","Frühling","Sommer","Herbst","Winter"];
const season=()=>["Winter","Winter","Frühling","Frühling","Frühling","Sommer","Sommer","Sommer","Herbst","Herbst","Herbst","Winter"][new Date().getMonth()];
const TIPS=[
 "Ein Teil darf laut sein, der Rest hält sich zurück. Dann sieht es gewollt aus.",
 "Wenn du zweifelst: Ärmel einmal hochkrempeln. Wirkt sofort lässiger.",
 "Maximal drei Farben im Outfit, dann passt fast alles zusammen.",
 "Oben weit, unten schmal. Oder andersrum. Beides weit nur, wenn du es so willst.",
 "Schuhe und Tasche müssen nicht gleich sein, nur miteinander befreundet.",
 "Das Teil, das du am längsten nicht anhattest, verdient heute eine Chance.",
 "Vorne ein Stück vom Shirt in den Bund stecken. Kleiner Trick, große Wirkung.",
 "Du siehst in allem gut aus. Das hier ist nur die Kür."];
const DEMO=[["Weißes T-Shirt","Oberteil","Weiß","Ganzjährig"],["Rosa Strickpulli","Oberteil","Rosa","Winter"],["Blaue Jeans","Unterteil","Blau","Ganzjährig"],["Schwarzer Rock","Unterteil","Schwarz","Ganzjährig"],["Blümchenkleid","Kleid","Bunt","Sommer"],["Beiger Mantel","Jacke","Beige","Herbst"],["Weiße Sneaker","Schuhe","Weiß","Ganzjährig"],["Braune Tasche","Accessoire","Braun","Ganzjährig"]];

/* ---------- Speicher: bleibt nur auf diesem Gerät ---------- */
const DB={db:null,
 open(){return new Promise(r=>{try{const q=indexedDB.open("szafa-wiki",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>{DB.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 get(k){return new Promise(r=>{if(!DB.db)return r(null);try{const q=DB.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
 set(k,v){if(!DB.db)return;try{DB.db.transaction("kv","readwrite").objectStore("kv").put(v,k)}catch(e){}}};
let S={items:[],outfits:[],plan:{},worn:[],daily:null,settings:{key:"",model:"claude-haiku-5-5",onboarded:false}};
const save=()=>DB.set("state",S);
const item=id=>S.items.find(i=>i.id===id);

/* ---------- Ansicht-Zustand ---------- */
let view="heute", filter="Alle", calMonth=new Date(), busy=false, tourStep=0, F=null, B=null, sample=null, confirmId=null;

/* ---------- Niklas ---------- */
function avatar(){return `<svg viewBox="0 0 120 120" role="img" aria-label="Niklas">
<circle cx="60" cy="60" r="58" fill="var(--rose-soft)"/>
<path d="M18 120c2-22 18-30 42-30s40 8 42 30z" fill="#fdfdfb"/>
<path d="M48 84h24v12c-6 6-18 6-24 0z" fill="#e9b999"/>
<path d="M42 92c8 12 28 12 36 0" fill="none" stroke="#9aa0a8" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 3.5"/>
<ellipse cx="34" cy="60" rx="5" ry="8" fill="#eec1a2"/><ellipse cx="86" cy="60" rx="5" ry="8" fill="#eec1a2"/>
<path d="M36 52c0-18 10-28 24-28s24 10 24 28v8c0 18-10 30-24 30S36 78 36 60z" fill="#f3cbae"/>
<path d="M37 64c2 16 11 26 23 26s21-10 23-26c-3 9-8 12-12 12-4-3-18-3-22 0-4 0-9-3-12-12z" fill="#8b6344" opacity=".55"/>
<path d="M49 72c4-3 18-3 22 0-3 2-19 2-22 0z" fill="#7a5539"/>
<path d="M52 78c5 4 11 4 16 0" fill="none" stroke="#a5503f" stroke-width="2.4" stroke-linecap="round"/>
<path d="M34 50c-3-16 6-30 26-31 5-4 11-3 12 1 10 2 17 12 14 30-3-9-8-14-14-16-9 4-22 5-30 3-4 3-6 7-8 13z" fill="#7b5a3c"/>
<path d="M70 20c4-5 9-4 9 0" fill="none" stroke="#7b5a3c" stroke-width="3" stroke-linecap="round"/>
<circle cx="50" cy="58" r="2.6" fill="#3b2a22"/><circle cx="70" cy="58" r="2.6" fill="#3b2a22"/>
<path d="M44 50h11M65 50h11" stroke="#6a4b33" stroke-width="2.4" stroke-linecap="round"/>
<g fill="rgba(255,255,255,.25)" stroke="#c9a961" stroke-width="2"><rect x="40" y="52" width="18" height="13" rx="3"/><rect x="62" y="52" width="18" height="13" rx="3"/></g>
<path d="M58 57h4M40 56l-5-2M80 56l5-2" stroke="#c9a961" stroke-width="2" fill="none"/>
</svg>`}
function niklas(text,pulse){return `<div class="niklas">${avatar()}<div class="bubble${pulse?" pulse":""}"><span class="who">Niklas</span>${text}</div></div>`}

/* ---------- KI: Claude Haiku ---------- */
const hasAI=()=>!!sample||!!S.settings.key;
async function askAI(prompt,img){
  if(sample){
    const o={modelTier:"quick",cache:false};
    if(img){const lim=await sample.limits().catch(()=>null); if(lim&&lim.images)o.images=[img.blob]; else throw {code:"images_unavailable"}}
    return await sample.json(prompt,o);
  }
  if(!S.settings.key) throw {code:"no_ai"};
  const content=[]; if(img)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:img.dataUrl.split(",")[1]}});
  content.push({type:"text",text:prompt});
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.settings.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:S.settings.model||"claude-haiku-5-5",max_tokens:500,messages:[{role:"user",content}]})});
  if(!r.ok) throw {code:r.status===401?"bad_key":r.status===429?"rate_limited":"upstream_error"};
  const t=((await r.json()).content||[]).map(c=>c.text||"").join("");
  const a=t.indexOf("{"),b=t.lastIndexOf("}"); if(a<0||b<0) throw {code:"invalid_json"};
  return JSON.parse(t.slice(a,b+1));
}
function aiError(e){const c=e&&e.code;
  toast(c==="no_ai"?"Erst den Schlüssel in den Einstellungen eintragen":c==="bad_key"?"Der Schlüssel wird nicht akzeptiert":c==="rate_limited"?"Gerade zu viele Anfragen, gleich nochmal":c==="not_granted"?"Claude wurde für die App nicht erlaubt":"Hat gerade nicht geklappt, probier es nochmal")}
const wardrobeJson=()=>JSON.stringify(S.items.map(i=>({id:i.id,name:i.name,kategorie:i.cat,farbe:i.color,saison:i.season,stil:i.style||"",getragen:i.wears||0})));
async function aiOutfit(occ){
  const d=await askAI(`Du bist Niklas, der Freund von Wiktoria (Spitzname Wiki), und ihr Stylist in ihrer Kleiderschrank-App. Stelle aus ihrem Schrank ein Outfit zusammen.
Datum: ${new Date().toLocaleDateString("de-DE")}, Jahreszeit: ${season()}. Anlass oder Wunsch: ${occ||"ganz normaler Tag"}.
Schrank als JSON: ${wardrobeJson()}

/* ---------- Outfit-Logik ohne KI ---------- */
function localOutfit(){
  const se=season(), by=c=>{const all=S.items.filter(i=>i.cat===c), fit=all.filter(i=>i.season==="Ganzjährig"||i.season===se);return fit.length?fit:all};
  const ids=[],dr=by("Kleid"),to=by("Oberteil"),bo=by("Unterteil");
  if(dr.length&&(Math.random()<.3||!to.length||!bo.length)) ids.push(pick(dr).id);
  else{ if(to.length)ids.push(pick(to).id); if(bo.length)ids.push(pick(bo).id) }
  const sh=by("Schuhe"),ja=by("Jacke"),ac=by("Accessoire");
  if(sh.length)ids.push(pick(sh).id);
  if(ja.length&&(se==="Herbst"||se==="Winter"||Math.random()<.3))ids.push(pick(ja).id);
  if(ac.length&&Math.random()<.6)ids.push(pick(ac).id);
  return ids;
}
function ensureDaily(){
  if(S.daily&&S.daily.date===TODAY()&&S.daily.items.every(item)&&S.daily.items.length) return;
  const ids=localOutfit(); S.daily=ids.length?{date:TODAY(),items:ids,title:"Dein Look für heute",tip:pick(TIPS)}:null; save();
}
function wear(ids,name,date){
  ids.forEach(id=>{const i=item(id); if(i)i.wears=(i.wears||0)+1});
  S.worn.push({date:date||TODAY(),items:ids.slice(),name:name||"Outfit"}); save();
}

function pic(i){return i.img?`<img src="${i.img}" alt="${esc(i.name)}">`:`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="${SHAPE[i.cat]||SHAPE.Oberteil}" fill="${COLORS[i.color]||"#d9c3bd"}" stroke="rgba(60,30,40,.28)" stroke-width=".8" stroke-linejoin="round"/></svg>`}
function collage(ids,small){const seen={};return `<div class="collage${small?" sm":""}">${ids.map(item).filter(Boolean).map(i=>{const s=SLOT[i.cat]||SLOT.Oberteil,n=seen[i.cat]=(seen[i.cat]||0)+1,o=(n-1)*9;

const pieces=ids=>`<div class="pieces">${ids.map(item).filter(Boolean).map(i=>tile(i)).join("")}</div>`;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

/* ---------- Foto ---------- */
function loadPhoto(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const dataUrl=c.toDataURL("image/jpeg",.8);c.toBlob(b=>res({dataUrl,blob:b}),"image/jpeg",.8)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
$("#file").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f||!F)return;
  let img; try{img=await loadPhoto(f)}catch(x){return toast("Das Foto konnte ich nicht lesen")}
  if(!F)return; syncF(); F.img=img.dataUrl;
  if(!hasAI()){itemSheet();return}
  F.scan=true; itemSheet();
  try{
    const d=await askAI(`Das Foto zeigt ein Kleidungsstück oder Accessoire. Antworte nur mit JSON: {"name":"kurzer deutscher Name, 2 bis 3 Wörter","kategorie":"eins von ${CATS.join(", ")}","farbe":"eins von ${Object.keys(COLORS).join(", ")}","saison":"eins von ${SEASONS.join(", ")}","stil":"1 bis 2 Wörter"}`,img);
    if(F){syncF(); if(!F.name)F.name=String(d.name||""); if(CATS.includes(d.kategorie))F.cat=d.kategorie; if(COLORS[d.farbe])F.color=d.farbe; if(SEASONS.includes(d.saison))F.season=d.saison; if(!F.style)F.style=String(d.stil||"")}
  }catch(x){ if(x.code!=="images_unavailable")aiError(x) }
  if(F){F.scan=false;itemSheet()}
});

 photo(){$("#file").click()},
 saveItem(){syncF(); if(!F.name.trim())return toast("Gib dem Teil noch einen Namen");
   const data={name:F.name.trim(),cat:F.cat,color:F.color,season:F.season,style:F.style.trim(),price:parseFloat(String(F.price).replace(",","."))||0,img:F.img};
   const ex=F.id&&item(F.id); if(ex)Object.assign(ex,data,{demo:false}); else S.items.unshift({id:uid(),wears:0,fav:false,...data});
   save();closeSheet();render();toast("Im Schrank")},
 fav(){const i=item(F.id);i.fav=!i.fav;save();syncF();itemSheet();render()},
 delItem(){ if(confirmId!==F.id){confirmId=F.id;syncF();return itemSheet()}
   const id=F.id;S.items=S.items.filter(i=>i.id!==id);S.outfits.forEach(o=>o.items=o.items.filter(x=>x!==id));S.outfits=S.outfits.filter(o=>o.items.length);
   save();closeSheet();render();toast("Gelöscht")},
 clearDemo(){const ids=S.items.filter(i=>i.demo).map(i=>i.id);S.items=S.items.filter(i=>!i.demo);S.outfits.forEach(o=>o.items=o.items.filter(x=>!ids.includes(x)));S.outfits=S.outfits.filter(o=>o.items.length);S.daily=null;save();render()},
 reroll(){const ids=localOutfit();S.daily={date:TODAY(),items:ids,title:"Dein Look für heute",tip:pick(TIPS)};save();render()},
 async askDaily(){const occ=$("#occ").value.trim(); if(!hasAI())return aiError({code:"no_ai"});
   busy=true;render(); try{const o=await aiOutfit(occ);S.daily={date:TODAY(),...o};save()}catch(e){aiError(e)} busy=false;render()},
 wearDaily(){wear(S.daily.items,S.daily.title);render();toast("Viel Spaß heute ♥")},
 saveDaily(){S.outfits.unshift({id:uid(),name:S.daily.title==="Dein Look für heute"?"Look vom "+new Date().toLocaleDateString("de-DE",{day:"numeric",month:"numeric"}):S.daily.title,items:S.daily.items.slice(),tip:S.daily.tip});save();toast("Bei den Outfits gespeichert")},
 build(){B={name:"",occ:"",ids:[],tip:""};buildSheet()},
 toggle(d){syncB();const i=B.ids.indexOf(d.id);i<0?B.ids.push(d.id):B.ids.splice(i,1);buildSheet()},
 bShuffle(){syncB();B.ids=localOutfit();B.tip=pick(TIPS);buildSheet()},
 async bAI(){syncB(); if(!hasAI())return aiError({code:"no_ai"}); if(!S.items.length)return toast("Dein Schrank ist noch leer");
   busy=true;buildSheet(); try{const o=await aiOutfit(B.occ); if(B){B.ids=o.items;B.tip=o.tip;if(!B.name)B.name=o.title}}catch(e){aiError(e)} busy=false; if(B)buildSheet()},
 saveOutfit(){syncB(); if(!B.ids.length)return toast("Wähl mindestens ein Teil aus");
   S.outfits.unshift({id:uid(),name:B.name.trim()||"Outfit "+(S.outfits.length+1),items:B.ids.slice(),tip:B.tip});save();closeSheet();view="outfits";render();toast("Outfit gespeichert")},
 outfit(d){confirmId=null;outfitSheet(d.id)},
 wearOutfit(d){const o=S.outfits.find(x=>x.id===d.id);wear(o.items,o.name);closeSheet();render();toast("Eingetragen")},
 planToday(d){const t=new Date();t.setDate(t.getDate()+1);S.plan[dkey(t)]=d.id;save();closeSheet();render();toast("Für morgen geplant")},
 delOutfit(d){ if(confirmId!==d.id){confirmId=d.id;return outfitSheet(d.id)}
   S.outfits=S.outfits.filter(o=>o.id!==d.id);Object.keys(S.plan).forEach(k=>{if(S.plan[k]===d.id)delete S.plan[k]});save();closeSheet();render()},
 month(d){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+ +d.d,1);render()},
 day(d){daySheet(d.k)},
 plan(d){S.plan[d.k]=d.id;save();render();daySheet(d.k)},
 unplan(d){delete S.plan[d.k];save();render();daySheet(d.k)},
 wearPlan(d){const o=S.outfits.find(x=>x.id===S.plan[d.k]); if(o){wear(o.items,o.name,d.k);delete S.plan[d.k];save()} render();daySheet(d.k)},
 settings(){confirmId=null;settingsSheet()},
 saveSettings(){S.settings.key=$("#s-key").value.trim();S.settings.model=$("#s-model").value.trim()||"claude-haiku-5-5";save();closeSheet();render();toast("Gespeichert")},
 reset(){ if(confirmId!=="reset"){confirmId="reset";return settingsSheet()}
   S={items:[],outfits:[],plan:{},worn:[],daily:null,settings:{...S.settings,onboarded:true}};save();closeSheet();render();toast("Alles gelöscht")},
 tour(){tourStep=0;tourSheet()},
 tourNext(){ if(tourStep<TOUR.length-1){tourStep++;tourSheet()} else A.tourEnd() },
 tourEnd(){S.settings.onboarded=true;save();sheet("");render()}
};
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-act]"); if(!el)return; const f=A[el.dataset.act]; if(f)f(el.dataset,el,ev)});

/* ---------- Start ---------- */
(async()=>{
  render();
  await DB.open();
  const st=await DB.get("state");
  if(st) S={...S,...st,settings:{...S.settings,...(st.settings||{})}};
  else S.items=DEMO.map(([name,cat,color,se])=>({id:uid(),name,cat,color,season:se,style:"",price:0,img:"",wears:0,fav:false,demo:true}));
  render();
  if(!S.settings.onboarded){tourStep=0;tourSheet()}
  try{sample=(window.claude&&window.claude.use)?await window.claude.use("sample"):null}catch(e){sample=null}
  if(sample&&!$("#sheet").innerHTML)render();
})();
</script>

</body></html>
