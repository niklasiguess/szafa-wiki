<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Szafa Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;800&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Layout: ruhige App-Fläche, weiße Karten ohne Rahmen, Glas-Elemente. Farbe kommt aus den Outfits selbst: jede Bühne ist ein Verlauf aus den Farben der Teile. Bewusst nur ein heller Look. */
:root{
  --bg:#F4F3F7; --card:#FFFFFF; --ink:#0F0E13; --mute:#6F6C7A; --line:#E7E5EE; --soft:#ECEAF2;
  --acc:#E0245E; --acc-soft:#FFD6E2; --on-acc:#FFFFFF; --st:#ECEAF2;
  --sh:0 10px 34px rgba(24,18,48,.09); --sh-s:0 2px 10px rgba(24,18,48,.07);
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:15.5px;line-height:1.48;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:12px 124px;max-width:560px;margin:0 auto;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display)}
h1{font-weight:800;font-size:38px;line-height:1.02;letter-spacing:-.035em}
h1 em,h2 em{font-style:normal;color:var(--acc)}
h2{font-weight:800;font-size:23px;line-height:1.1;letter-spacing:-.025em}
h3{font-weight:800;font-size:16px;letter-spacing:-.01em}
p{margin:0}
a{color:inherit;text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.03em;text-transform:lowercase}
.brand em{font-style:normal;color:var(--acc)}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.center{text-align:center;justify-content:center}
.muted{color:var(--mute);font-size:13.5px}
.eyebrow{font-size:12.5px;color:var(--mute);font-weight:600}
.hello{display:flex;align-items:center;gap:14px}
.hello>svg{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:var(--sh-s)}
.hello h1{font-size:32px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--card);box-shadow:var(--sh-s);font-size:13px;font-weight:600;white-space:nowrap}
.pill.sun{background:var(--ink);color:#fff}
.pill svg{width:15px;height:15px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh-s);display:grid;place-items:center;flex:none;font-weight:700}
.icon-btn svg{width:19px;height:19px}
.btn{background:var(--ink);color:#fff;padding:13px 20px;border-radius:999px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:transform .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:17px;height:17px}
.btn:active,.round:active,.alt:active{transform:scale(.96)}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh-s)}
.btn.small{padding:9px 14px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.btn.danger{background:none;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
/* Niklas */
.niklas{display:flex;gap:10px;align-items:flex-end}
.niklas>svg{flex:none;width:48px;height:48px;border-radius:50%;box-shadow:var(--sh-s)}
.bubble{background:var(--card);box-shadow:var(--sh-s);border-radius:22px 22px 22px 6px;padding:12px 16px;min-width:0;flex:1}
.bubble .who{font-size:12px;color:var(--acc);font-weight:700;display:block;margin-bottom:1px}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
/* Bühne: Verlauf aus den Farben des Outfits */
.stage{position:relative;flex:none;background:var(--st);border-radius:32px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.deck{touch-action:pan-y;transition:transform .2s,box-shadow .2s;will-change:transform;box-shadow:var(--sh)}
.deck[data-sw=yes]{box-shadow:0 0 0 4px var(--acc)}
.deck[data-sw=no]{box-shadow:0 0 0 4px var(--ink)}
.sticker,.stage-foot,.tile .tag{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.sticker{position:absolute;top:14px;left:14px;z-index:2;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700}
.sticker.r{left:auto;right:14px;color:var(--acc)}
.stage-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:22px;padding:12px 12px 12px 16px}
.stage-foot>div{min-width:0}
.reason{font-size:12.5px;font-weight:600;color:var(--mute);margin-top:2px}
.collage{position:relative;aspect-ratio:1/1.1;width:100%}
.collage.sm{aspect-ratio:1/1.08}
.cz{position:absolute;aspect-ratio:3/4;animation:drop .5s cubic-bezier(.2,.9,.3,1.25) backwards}
.cz:nth-child(2){animation-delay:.05s}.cz:nth-child(3){animation-delay:.1s}.cz:nth-child(4){animation-delay:.15s}.cz:nth-child(5){animation-delay:.2s}
@keyframes drop{from{opacity:0;translate:0 -16px}}
.cz svg,.cz img.cut{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(24,18,48,.2))}
.cz.shot{background:var(--card);padding:4px;border-radius:14px;box-shadow:0 10px 18px rgba(24,18,48,.18)}
.cz.shot img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.acts{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:-6px}
.round{width:60px;height:60px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;transition:transform .12s}
.round svg{width:25px;height:25px}
.round.mid{width:46px;height:46px}.round.mid svg{width:19px;height:19px}
.round.yes{background:var(--acc);color:var(--on-acc);box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 45%,transparent)}
.round.yes svg{fill:currentColor}
.round.on{background:var(--ink);color:#fff}
@media (prefers-reduced-motion:reduce){.pulse,.cz,.sheet{animation:none!important}.btn,.round,.deck,.alt{transition:none}}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.alt{flex:none;width:150px;display:flex;flex-direction:column;gap:6px;text-align:left;scroll-snap-align:start;transition:transform .12s}
.alt .stage{border-radius:24px;padding:6px}
.alt span{font-size:12.5px;font-weight:600;color:var(--mute);line-height:1.3;padding:0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trend{flex:none;width:236px;background:var(--bg);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;scroll-snap-align:start}
.trend b{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em}
.trend p{font-size:13.5px}
.trend .btn{margin-top:auto}
/* Teile */
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px}
@media (min-width:430px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;min-width:0}
.tile .pic{position:relative;display:block;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:var(--card);box-shadow:var(--sh-s)}
.card .tile .pic,.sheet .tile .pic{box-shadow:none;background:var(--card)}
.card .tile .pic{background:var(--bg)}
.tile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pic img.cut{object-fit:contain;padding:9%}
.tile .pic svg{width:100%;height:100%;padding:17%}
.tile .cap{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tile .tag{position:absolute;bottom:8px;left:8px;font-size:10.5px;font-weight:700;color:var(--ink);padding:3px 8px;border-radius:99px;box-shadow:var(--sh-s)}
.tile .heart{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:12px}
.tile.dim .pic{opacity:.45}
.tile.sel .pic{box-shadow:0 0 0 2.5px var(--acc)}
.tile.sel .pic::after{content:"✓";position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:13px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--card);box-shadow:var(--sh-s);font-size:13.5px;font-weight:600}
.card .chip{background:var(--bg);box-shadow:none}
.chip.on,.card .chip.on{background:var(--ink);color:#fff}
.chip b{font-weight:600;opacity:.5;margin-left:4px}
.card{background:var(--card);box-shadow:var(--sh-s);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card.sun{background:linear-gradient(135deg,var(--acc-soft),#FFF0DC)}
.card.acc{background:linear-gradient(135deg,#EDE9FF,var(--acc-soft))}
.card.sun .chip,.card.acc .chip{background:rgba(255,255,255,.7)}
.card.ink{background:var(--ink);color:#fff}
.card.ink .muted{color:#B8B4C4}
.empty{text-align:center;padding:36px 16px;border-radius:28px;background:var(--soft);color:var(--mute)}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;font-size:14.5px}
.li span{min-width:0}
.x{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(15,14,19,.07);color:var(--ink);font-size:11px;font-weight:800;display:grid;place-items:center}
/* Outfits */
.ogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px}
.ocard{display:flex;flex-direction:column;gap:7px;min-width:0;text-align:left}
.ocard .stage{border-radius:24px;padding:6px}
.ocard .sticker{top:8px;left:8px;font-size:11px;padding:4px 9px}
.ocard b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;padding:0 4px}
.ocard span.s{font-size:12.5px;color:var(--mute);padding:0 4px}
.duo{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;align-items:stretch}
.duo .inspo{width:100%;height:100%;object-fit:cover;border-radius:24px;min-height:0;aspect-ratio:3/4.6}
/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-variant-numeric:tabular-nums}
.cal span{text-align:center;font-size:12px;color:var(--mute);font-weight:600}
.day{aspect-ratio:1;border-radius:16px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--card)}
.day.today{background:var(--ink);color:#fff}
.day i{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--acc)}
.day i.worn{background:var(--acc)}
/* Zahlen */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{border-radius:24px;padding:16px 8px 13px;text-align:center;font-size:12.5px;font-weight:600;color:var(--mute);background:var(--card);box-shadow:var(--sh-s)}
.num b{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.04em;line-height:1;display:block;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:74px 1fr 22px;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.bar div{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar div u{display:block;height:100%;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(15,14,19,.12)}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
nav div{display:flex;width:100%;max-width:420px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-radius:30px;padding:6px;pointer-events:auto;box-shadow:0 14px 40px rgba(24,18,48,.16),inset 0 0 0 1px rgba(255,255,255,.7)}
nav button{flex:1;padding:8px 2px 7px;font-size:11px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:24px}
nav button svg{width:22px;height:22px}
nav button.on{background:var(--ink);color:#fff}
/* Sheet */
.veil{position:fixed;inset:0;background:rgba(15,14,19,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:93%;overflow-y:auto;border-radius:34px 34px 0 0;animation:up .28s cubic-bezier(.2,.8,.3,1);
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
input[type=text],input[type=number],input[type=password],select{background:var(--card);border:1.5px solid transparent;box-shadow:var(--sh-s);border-radius:16px;padding:13px 15px;font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.card input[type=text],.card input[type=password]{background:var(--bg);box-shadow:none}
input:focus,select:focus{border-color:var(--ink);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inrow{display:flex;gap:8px}.inrow input{flex:1}
.photo{position:relative;aspect-ratio:4/3;border-radius:28px;background:var(--st);display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:14px;cursor:pointer}
.photo span{display:flex;flex-direction:column;align-items:center;gap:8px}
.photo span svg{width:34px;height:34px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px}
.sw{display:flex;gap:10px}
.sw button{width:38px;height:38px;border-radius:50%}
.sw button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:40;max-width:90%;text-align:center;box-shadow:var(--sh)}
.tour{align-items:center;padding:22px}
.tour .sheet{border-radius:34px;text-align:center;align-items:center;padding-top:30px;background:var(--card)}
.tour .sheet>svg{width:132px;height:132px;border-radius:50%;box-shadow:var(--sh)}
.tour h2{font-size:28px}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc);width:20px;border-radius:99px}
</style>

<div id="app"></div>
<nav aria-label="Bereiche"><div id="nav"></div></nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=()=>dkey(new Date());
const CATS=["Oberteil","Unterteil","Kleid","Jacke","Schuhe","Accessoire"];
const SHAPE={Oberteil:"M16 6l-12 6 4 9 6-3v24h20V18l6 3 4-9-12-6c-1 4-4 6-8 6s-7-2-8-6z",Unterteil:"M13 5h22l3 38H27l-3-24-3 24H10z",Kleid:"M18 4l-2 8 4 6-9 26h26l-9-26 4-6-2-8h-3c0 3-2 5-3 5s-3-2-3-5z",Jacke:"M17 5L6 11 4 41h8V22l2 21h9V12zM31 5l11 6 2 30h-8V22l-2 21h-9V12z",Schuhe:"M4 30c0-6 2-12 6-12 2 4 6 6 10 6l14 4c6 1 10 3 10 8v2H4z",Accessoire:"M10 20h28l3 22H7zM17 20v-5a7 7 0 0114 0v5h-3v-5a4 4 0 00-8 0v5z"};
const SLOT={Jacke:[2,2,47,-6],Oberteil:[50,4,46,5],Kleid:[27,8,46,2],Unterteil:[7,42,43,-3],Accessoire:[60,40,26,-9],Schuhe:[55,62,32,7]};
const COLORS={Schwarz:"#2b2b2e",Weiß:"#f6f3ee",Beige:"#dccbb0",Braun:"#8a6248",Grau:"#a3a3a8",Blau:"#4f78c4",Rosa:"#f29bb5",Rot:"#d43f3f",Grün:"#5fa06b",Gelb:"#f2cf45",Lila:"#a07fd6",Bunt:"#f0a66b"};
const SEASONS=["Ganzjährig","Frühling","Sommer","Herbst","Winter"];
const mesh=(a,b,c)=>`radial-gradient(90% 70% at 8% 0%,${a} 0,transparent 70%),radial-gradient(80% 70% at 100% 18%,${b} 0,transparent 70%),radial-gradient(100% 80% at 55% 110%,${c} 0,transparent 70%),#F1EFF6`;
const STAGES=[mesh("#FFB8CF","#FFD9A8","#CFC4FF"),mesh("#FFE066","#FFC2A6","#C9EDBF"),mesh("#B5D4FF","#D6C6FF","#FFCBDD"),mesh("#C9B8FF","#FFBBD6","#FFE0A8"),mesh("#A9E8C6","#C4DCFF","#FFE9A6"),mesh("#FFC09A","#FFC4DA","#D3C8FF")];
const NEUTRAL={Schwarz:1,Weiß:1,Beige:1,Braun:1,Grau:1};
const HUE={Blau:220,Rosa:340,Rot:0,Grün:130,Gelb:50,Lila:270};
const tint=(hex,t)=>"#"+[1,3,5].map(i=>Math.round(parseInt(hex.slice(i,i+2),16)*(1-t)+255*t).toString(16).padStart(2,"0")).join("");
const KNOW=`Farbenlehre: Neutrale Töne (Schwarz, Weiß, Grau, Beige, Braun, Denim) passen zu allem. Höchstens drei Farben pro Outfit, verteilt etwa 60 % Hauptfarbe, 30 % Zweitfarbe, 10 % Akzent. Stimmig sind Ton in Ton, Nachbarfarben im Farbkreis oder Komplementärfarben (Blau und Orange, Lila und Gelb, Rot und Grün, Rosa und Grün), dann eine davon nur als Akzent. Eine Farbe an zweiter Stelle wiederholen (Tasche, Schuhe) verbindet das Outfit. Warme Töne zu warmen, kühle zu kühlen.
Muster: höchstens ein auffälliges Muster, der Rest einfarbig in einer Farbe aus dem Muster.
Silhouette: weit zu schmal kombinieren (Oversize oben und schmal unten oder umgekehrt). Drittelregel statt Halbierung: kurzes oder eingestecktes Oberteil zu hoher Taille, oder langes Oberteil zu schmaler Hose.
Material: Kontraste machen es spannend (Strick zu Satin, Leder zu Wolle, Denim zu Seide). Höchstens ein glänzendes Teil.
Anlass: Die Förmlichkeit der Teile muss zusammenpassen. Ein bewusster Stilbruch (Sneaker zum Kleid, Blazer zur Jeans) wirkt modern, zwei wirken zufällig. Die Schuhe entscheiden über die Förmlichkeit.

async function askAI(prompt,img){
  if(sample){const o={modelTier:"quick",cache:false};
    if(img){const lim=await sample.limits().catch(()=>null); if(lim&&lim.images)o.images=[img.blob]; else throw {code:"images_unavailable"}}

  if(!S.settings.key) throw {code:"no_ai"};
  const content=[]; if(img)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:img.dataUrl.split(",")[1]}});
  content.push({type:"text",text:prompt});
  let r; try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.settings.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:S.settings.model||"claude-haiku-5-5",max_tokens:800,messages:[{role:"user",content}]})})}catch(e){throw {code:"offline"}}
  if(!r.ok) throw {code:r.status===401?"bad_key":r.status===404?"bad_model":r.status===429?"rate_limited":"upstream_error"};
  const t=((await r.json()).content||[]).map(c=>c.text||"").join("");
  const a=t.indexOf("{"),b=t.lastIndexOf("}"); if(a<0||b<0) throw {code:"invalid_json"};
  try{return JSON.parse(t.slice(a,b+1))}catch(e){throw {code:"invalid_json"}}
}

    if(!r.ok)throw {code:r.status===401?"bad_key":r.status===404?"bad_model":r.status===429?"rate_limited":"upstream_error"};
    const bl=(await r.json()).content||[],t=bl.filter(b=>b.type==="text").map(b=>b.text||"").join("");
    let a=t.lastIndexOf('{"trends"');if(a<0)a=t.indexOf("{");const z=t.lastIndexOf("}");if(a<0||z<a)throw {code:"invalid_json"};
    let d;try{d=JSON.parse(t.slice(a,z+1))}catch(e){throw {code:"invalid_json"}}
    const items=(Array.isArray(d.trends)?d.trends:[]).filter(x=>x&&x.titel).slice(0,5).map(x=>({titel:String(x.titel).slice(0,40),kurz:String(x.kurz||"").slice(0,180),tipp:String(x.tipp||"").slice(0,180)}));
    if(!items.length)throw {code:"invalid_json"};
    const src=[],hosts={};bl.filter(b=>b.type==="web_search_tool_result"&&Array.isArray(b.content)).forEach(b=>b.content.forEach(c=>{try{const u=new URL(c.url);if(u.protocol==="https:"&&!hosts[u.host]&&src.length<4){hosts[u.host]=1;src.push({title:String(c.title||u.host).slice(0,50),url:u.href})}}catch(e){}}));

function bump(ids,v){const t=S.taste,its=ids.map(item).filter(Boolean);
  its.forEach(i=>t.score[i.id]=(t.score[i.id]||0)+v*.5);
  for(let a=0;a<its.length;a++)for(let b=a+1;b<its.length;b++){const k=pk(its[a].id,its[b].id),c=pk(its[a].color,its[b].color);t.pair[k]=(t.pair[k]||0)+v;t.cp[c]=(t.cp[c]||0)+v*.4}}
function feedback(ids,v,why,occ){bump(ids,v);S.taste.fb.unshift({v,items:names(ids),why:why||"",occ:occ||"",d:TODAY()});S.taste.fb.length=Math.min(S.taste.fb.length,40);learned()}
function logSwap(ids,outId,inId){const t=S.taste,rest=ids.filter(x=>x!==inId&&x!==outId);
  const adj=(id,v)=>{const a=item(id);if(!a)return;rest.forEach(r=>{const b=item(r);if(!b)return;const k=pk(id,r),c=pk(a.color,b.color);t.pair[k]=(t.pair[k]||0)+v;t.cp[c]=(t.cp[c]||0)+v*.4})};
  if(inId)adj(inId,1); if(outId){adj(outId,-.7);t.score[outId]=(t.score[outId]||0)-.2}
  t.swaps.unshift({out:outId?(item(outId)||{}).name||"":"",in:inId?(item(inId)||{}).name||"":"",with:names(rest)});t.swaps.length=Math.min(t.swaps.length,30);learned()}
function learned(){S.taste.n=(S.taste.n||0)+1;save();if(S.taste.n%4===0)distill(true)}
function tasteText(){const t=S.taste,L=[];
  if(t.rules.length)L.push("Wikis eigene Regeln (unbedingt beachten): "+t.rules.join("; "));
  if(t.notes.length)L.push("Bisher gelernt: "+t.notes.join("; "));
  const li=t.fb.filter(f=>f.v>0).slice(0,8),di=t.fb.filter(f=>f.v<0).slice(0,8);
  if(li.length)L.push("Gemocht:\n"+li.map(f=>"- "+f.items.join(" + ")+(f.occ?" (Anlass: "+f.occ+")":"")).join("\n"));
  if(di.length)L.push("Abgelehnt:\n"+di.map(f=>"- "+f.items.join(" + ")+(f.why?" (Grund: "+f.why+")":"")).join("\n"));
  if(t.swaps.length)L.push("Von ihr geändert:\n"+t.swaps.slice(0,8).map(s=>"- "+(s.out&&s.in?`statt ${s.out} lieber ${s.in}`:s.in?`${s.in} ergänzt`:`${s.out} entfernt`)+(s.with.length?" zu "+s.with.join(", "):"")).join("\n"));
  return L.length?L.join("\n"):"Noch kein Feedback vorhanden."}
async function distill(quiet){
  if(!hasAI()){if(!quiet)aiError({code:"no_ai"});return}
  if(S.taste.fb.length+S.taste.swaps.length<2){if(!quiet)toast("Dafür brauche ich erst ein paar Likes von dir");return}
  if(!quiet){busy=true;render()}
  try{const d=await askAI(`Du bist Niklas, Wikis Freund und Stylist. Hier ist ihr Feedback zu Outfits aus ihrer Kleiderschrank-App.
${tasteText()}
Fasse in 3 bis 5 kurzen Stichpunkten in Du-Form zusammen, was sie mag und was nicht (Farben, Kombinationen, Schnitte, Anlässe). Nur was das Feedback wirklich zeigt.
Antworte nur mit JSON: {"notizen":["..."]}`);
    if(Array.isArray(d.notizen)&&d.notizen.length){S.taste.notes=d.notizen.slice(0,5).map(x=>String(x).slice(0,140));save()}
  }catch(e){if(!quiet)aiError(e)}
  if(!quiet)busy=false;
  if(!sheetOpen()&&(view==="stil"||!quiet))render()}

/* ---------- Outfit-Logik ohne KI: 30 Kandidaten würfeln, den passendsten nehmen ---------- */
function fit(ids){const t=S.taste,its=ids.map(item).filter(Boolean),f=feel();let s=0;
  its.forEach(i=>{s+=(t.score[i.id]||0);if(!i.wears)s+=.3;if(i.fav)s+=.4;if(i.season!=="Ganzjährig"&&i.season!==f)s-=1.3});
  for(let a=0;a<its.length;a++)for(let b=a+1;b<its.length;b++)s+=(t.pair[pk(its[a].id,its[b].id)]||0)+(t.cp[pk(its[a].color,its[b].color)]||0);
  s+=harmony(its).s*1.2;
  const j=its.some(i=>i.cat==="Jacke"),cold=f==="Winter"||f==="Herbst";
  if(cold&&!j&&avail().some(i=>i.cat==="Jacke"))s-=1; if(f==="Sommer"&&j)s-=2;
  return s}
function randomOutfit(){const by=c=>avail().filter(i=>i.cat===c),ids=[],dr=by("Kleid"),to=by("Oberteil"),bo=by("Unterteil");
  if(dr.length&&(Math.random()<.3||!to.length||!bo.length))ids.push(pick(dr).id);
  else{if(to.length)ids.push(pick(to).id);if(bo.length)ids.push(pick(bo).id)}
  const sh=by("Schuhe"),ja=by("Jacke"),ac=by("Accessoire");
  if(sh.length)ids.push(pick(sh).id); if(ja.length&&Math.random()<.5)ids.push(pick(ja).id); if(ac.length&&Math.random()<.5)ids.push(pick(ac).id);
  return ids}
function localOutfit(not){let best=[],bs=-1e9;const nk=not?not.slice().sort().join():"";
  for(let n=0;n<30;n++){const c=randomOutfit();if(!c.length)break;if(c.slice().sort().join()===nk)continue;const s=fit(c)+Math.random()*1.6;if(s>bs){bs=s;best=c}}
  return best.length?best:randomOutfit()}
function newDaily(not){const ids=localOutfit(not),alts=[],seen=[ids.slice().sort().join()];
  for(let n=0;n<10&&alts.length<3&&ids.length>1;n++){const a=localOutfit(ids),k=a.slice().sort().join();if(a.length>1&&!seen.includes(k)){seen.push(k);alts.push(a)}}
  S.daily=ids.length>1?{date:TODAY(),items:ids,title:"Look des Tages",tip:pick(TIPS),rated:0,occ:"",why:"",alts}:null;save()}
function ensureDaily(){const d=S.daily; if(d&&d.date===TODAY()&&d.items.length&&d.items.every(item))return; newDaily()}
function wear(ids,name,date){ids.forEach(id=>{const i=item(id);if(i){i.wears=(i.wears||0)+1;i.last=date||TODAY()}});
  S.worn.push({date:date||TODAY(),items:ids.slice(),name:name||"Outfit"});bump(ids,.5);save()}
function streak(){const days=new Set(S.worn.map(w=>w.date)),d=new Date();let n=0;if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function stageOf(ids){const v=[...new Set(ids.map(item).filter(Boolean).map(i=>i.color))].filter(c=>!NEUTRAL[c]).map(c=>tint(COLORS[c],.38));
  if(!v.length)return STAGES[[...ids.join("")].reduce((a,c)=>a+c.charCodeAt(0),0)%STAGES.length];
  return mesh(v[0],v[1]||"#FFE3CF",v[2]||"#E4DCFF")}
/* Farbharmonie nach Farbkreis: liefert Punktzahl und eine Begründung in Worten */
function harmony(its){const v=its.filter(i=>!NEUTRAL[i.color]&&!(i.color==="Blau"&&i.cat==="Unterteil")),cs=[...new Set(v.map(i=>i.color))],hs=cs.filter(c=>c!=="Bunt");
  if(!cs.length)return {s:.6,why:"Ruhige Neutraltöne, das wirkt immer stimmig"};
  if(cs.length===1)return {s:1,why:v.length>1?`Ton in Ton mit ${cs[0]}`:cs[0]==="Bunt"?"Ein Muster als Blickfang, der Rest bleibt ruhig":`${cs[0]} als einziger Farbtupfer zu ruhigen Tönen`};
  if(cs.length===2&&hs.length===2){let d=Math.abs(HUE[hs[0]]-HUE[hs[1]]);d=Math.min(d,360-d);
    if(d<=60)return {s:.8,why:`${hs[0]} und ${hs[1]} sind Nachbarn im Farbkreis`};
    if(d>=135)return {s:.6,why:`${hs[0]} und ${hs[1]} sind Komplementärfarben und lassen sich leuchten`};
    return {s:-.6,why:`${hs[0]} mit ${hs[1]} ist gewagt, aber mutig`}}
  if(cs.length===2)return {s:.2,why:`Das Muster trifft auf ${hs[0]}`};
  return {s:-1.2,why:"Viele Farben auf einmal, bewusst bunt"}}
const explain=ids=>harmony(ids.map(item).filter(Boolean)).why;

function tile(i,o={}){return `<button class="tile${o.sel?" sel":""}${i.wash&&!o.act?" dim":""}" data-act="${o.act||"item"}" data-id="${i.id}"><span class="pic">${pic(i)}${i.wash?'<span class="tag">Wäsche</span>':i.demo?'<span class="tag">Beispiel</span>':""}${i.fav?'<span class="heart">♥</span>':""}</span><span class="cap">${esc(i.name)}</span></button>`}
const pieces=ids=>`<div class="pieces">${ids.map(item).filter(Boolean).map(i=>tile(i)).join("")}</div>`;
function collage(ids,o={}){const seen={};return `<div class="collage${o.sm?" sm":""}">${ids.map(item).filter(Boolean).map(i=>{const s=SLOT[i.cat]||SLOT.Oberteil,n=seen[i.cat]=(seen[i.cat]||0)+1,off=(n-1)*9;
  return `<${o.act?"button":"span"} class="cz${U[i.id]&&!i.cut?" shot":""}"${o.act?` data-act="${o.act}" data-id="${i.id}" data-ctx="${o.ctx||""}" aria-label="${esc(i.name)} tauschen"`:""} style="left:${s[0]+off}%;top:${s[1]+off}%;width:${s[2]}%;transform:rotate(${s[3]}deg)">${pic(i)}</${o.act?"button":"span"}>`}).join("")}</div>`}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800)}
function sheet(html,cls){$("#sheet").innerHTML=html?`<div class="veil ${cls||""}" data-act="veil"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`:""}

  o.getContext("2d").drawImage(c,x0,y0,bw,bh,0,0,o.width,o.height);return o.toDataURL("image/webp",.86)}catch(e){return null}}

  F.scan=true;itemSheet();
  try{const d=await askAI(`Das Foto zeigt ein Kleidungsstück oder Accessoire. Antworte nur mit JSON: {"name":"kurzer deutscher Name, 2 bis 3 Wörter","kategorie":"eins von ${CATS.join(", ")}","farbe":"eins von ${Object.keys(COLORS).join(", ")}","saison":"eins von ${SEASONS.join(", ")}","stil":"2 bis 4 Stichworte zu Schnitt, Material, Muster und Stil"}`,img);
    if(F){syncF();if(!F.name)F.name=String(d.name||"").slice(0,40);if(CATS.includes(d.kategorie))F.cat=d.kategorie;if(COLORS[d.farbe])F.color=d.farbe;if(SEASONS.includes(d.saison))F.season=d.saison;if(!F.style)F.style=String(d.stil||"").slice(0,60)}
  }catch(x){if(x.code!=="images_unavailable")aiError(x)}
  if(F){F.scan=false;itemSheet()}
});
$("#imp").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=="szafa-wiki"||!j.data||!j.data.state)throw 0;
    const key=S.settings.key,model=S.settings.model;for(const k in U)DB.del("img:"+k);
    j.data.state.settings={...(j.data.state.settings||{}),key,model};for(const k in j.data)DB.set(k,j.data[k]);
    closeSheet();setTimeout(async()=>{await boot();toast("Sicherung geladen")},300)}catch(x){toast("Das ist keine gültige Sicherung")}});

/* ---------- Aktionen ---------- */
const A={
 go(d){view=d.v;render();window.scrollTo(0,0)},
 filter(d){filter=d.c;render()},
 close:closeSheet,
 veil(d,el,ev){if(ev.target!==el||el.classList.contains("tour"))return;SW?A.swapClose():closeSheet()},
 add(){F={id:null,name:"",cat:"Oberteil",color:"Schwarz",season:"Ganzjährig",style:"",price:"",img:""};itemSheet()},
 item(d){const i=item(d.id);if(!i)return;SW=null;R=null;B=null;F={id:i.id,name:i.name,cat:i.cat,color:i.color,season:i.season,style:i.style||"",price:i.price||"",img:""};itemSheet()},
 photo(){fileMode="item";$("#file").click()},
 cutToggle(d){syncF();F.useCut=d.v==="1";F.img=F.useCut?F.cutImg:F.orig;itemSheet()},
 saveItem(){syncF();if(!F.name.trim())return toast("Gib dem Teil noch einen Namen");
   const data={name:F.name.trim(),cat:F.cat,color:F.color,season:F.season,style:F.style.trim(),price:parseFloat(String(F.price).replace(",","."))||0};
   let it=F.id&&item(F.id);if(it)Object.assign(it,data,{demo:false});else{it={id:uid(),wears:0,fav:false,wash:false,cut:false,...data};S.items.unshift(it)}
   if(F.img){setImg(it.id,F.img);it.cut=!!F.useCut}
   if(F.cutting&&F.tok)pendingCut[F.tok]=it.id;
   save();closeSheet();render();toast("Im Schrank")},
 fav(){const i=item(F.id);i.fav=!i.fav;save();syncF();itemSheet();render()},
 wash(){const i=item(F.id);i.wash=!i.wash;save();syncF();itemSheet();render();toast(i.wash?"In der Wäsche. Ich schlage es solange nicht vor.":"Wieder im Schrank")},
 delItem(){if(confirmId!==F.id){confirmId=F.id;syncF();return itemSheet()}
   dropItems([F.id]);closeSheet();render();toast("Gelöscht")},
 clearDemo(){dropItems(S.items.filter(i=>i.demo).map(i=>i.id));render()},
 reroll(){newDaily(S.daily&&S.daily.items);render()},
 like(){const d=S.daily;if(!d)return;if(d.rated>0)return toast("Hab ich mir schon gemerkt ♥");d.rated=1;feedback(d.items,1,"",d.occ);render();toast(pick(YAY))},
 dislike(){if(S.daily)whySheet()},
 why(d){const o=S.daily;feedback(o.items,-1,d.w,o.occ);newDaily(o.items);sheet("");render();toast("Verstanden. Hier ist etwas anderes.")},
 occ(d){const e=$("#occ");if(e){e.value=d.o;A.askDaily()}},
 async askDaily(){const occ=$("#occ").value.trim();if(!hasAI())return aiError({code:"no_ai"});
   busy=true;render();try{const o=await aiOutfit({occ});S.daily={date:TODAY(),items:o.items,title:o.title,tip:o.tip,rated:0,occ,why:o.why,alts:(S.daily&&S.daily.alts)||[]};save()}catch(e){aiError(e)}busy=false;if($("#occ"))$("#occ").value="";render()},
 wearDaily(){wear(S.daily.items,S.daily.title);render();toast("Viel Spaß heute ♥")},
 saveDaily(){const d=S.daily;S.outfits.unshift({id:uid(),name:d.title==="Look des Tages"?"Look vom "+new Date().toLocaleDateString("de-DE",{day:"numeric",month:"numeric"}):d.title,items:d.items.slice(),tip:d.tip,rating:d.rated||0});save();toast("Bei den Outfits gespeichert")},
 swap(d){SW={ctx:d.ctx,id:d.id};swapSheet()},
 addPiece(d){SW={ctx:d.ctx,id:null};swapSheet()},
 swapTo(d){const c=SW.ctx,old=SW.id,ids=ctxGet(c).slice();if(old)ids[ids.indexOf(old)]=d.id;else ids.push(d.id);
   ctxSet(c,ids);logSwap(ids,old,d.id);ctxBack(c);toast(old?"Getauscht und gemerkt":"Ergänzt und gemerkt")},
 swapOut(){const c=SW.ctx,old=SW.id,ids=ctxGet(c).filter(x=>x!==old);ctxSet(c,ids);logSwap(ids,old,null);ctxBack(c);toast("Rausgenommen und gemerkt")},
 swapClose(){ctxBack(SW.ctx)},
 build(){B={name:"",occ:"",ids:[],tip:"",ai:null};buildSheet()},
 toggle(d){syncB();const i=B.ids.indexOf(d.id);i<0?B.ids.push(d.id):B.ids.splice(i,1);buildSheet()},
 bShuffle(){syncB();B.ids=localOutfit(B.ids);B.tip=pick(TIPS);B.ai=null;buildSheet()},
 async bAI(){syncB();if(!hasAI())return aiError({code:"no_ai"});if(!avail().length)return toast("Dein Schrank ist noch leer");
   busy=true;buildSheet();try{const o=await aiOutfit({occ:B.occ});if(B){B.ids=o.items;B.ai=o.items.slice();B.tip=o.tip;if(!B.name)B.name=o.title}}catch(e){aiError(e)}busy=false;if(B)buildSheet()},
 saveOutfit(){syncB();if(!B.ids.length)return toast("Wähl mindestens ein Teil aus");
   if(B.ai){const out=B.ai.filter(x=>!B.ids.includes(x)),inn=B.ids.filter(x=>!B.ai.includes(x));
     out.forEach(o=>{const m=inn.find(n=>item(n).cat===item(o).cat);if(m)inn.splice(inn.indexOf(m),1);logSwap(B.ids,o,m||null)});inn.forEach(n=>logSwap(B.ids,null,n))}
   bump(B.ids,.5);S.outfits.unshift({id:uid(),name:B.name.trim()||"Outfit "+(S.outfits.length+1),items:B.ids.slice(),tip:B.tip,rating:0});save();closeSheet();view="outfits";render();toast("Outfit gespeichert")},
 outfit(d){confirmId=null;outfitSheet(d.id)},
 rate(d){const o=S.outfits.find(x=>x.id===d.id),v=+d.v;if(!o)return;if(o.rating===v){o.rating=0;save()}else{o.rating=v;feedback(o.items,v,"","")}
   render();outfitSheet(d.id);toast(o.rating>0?pick(YAY):o.rating<0?"Gemerkt. So etwas schlage ich seltener vor.":"Bewertung entfernt")},
 wearOutfit(d){const o=S.outfits.find(x=>x.id===d.id);wear(o.items,o.name);closeSheet();render();toast("Eingetragen")},
 planTomorrow(d){const t=new Date();t.setDate(t.getDate()+1);S.plan[dkey(t)]=d.id;save();closeSheet();render();toast("Für morgen geplant")},
 delOutfit(d){if(confirmId!==d.id){confirmId=d.id;return outfitSheet(d.id)}
   S.outfits=S.outfits.filter(o=>o.id!==d.id);Object.keys(S.plan).forEach(k=>{if(S.plan[k]===d.id)delete S.plan[k]});delImg("inspo-"+d.id);save();closeSheet();render()},
 inspo(){if(!hasAI())return aiError({code:"no_ai"});if(avail().length<2)return toast("Leg erst ein paar Teile in den Schrank");fileMode="inspo";$("#file").click()},
 inspoSave(){const id=uid();S.outfits.unshift({id,name:R.title,items:R.items.slice(),tip:R.tip,desc:R.desc,inspo:true,rating:0});setImg("inspo-"+id,R.img);bump(R.items,.5);save();closeSheet();view="outfits";render();toast("Outfit gespeichert")},
 wishAdd(){R.missing.forEach(m=>{if(!S.wish.includes(m))S.wish.push(m)});R.wished=true;save();inspoSheet()},
 wishDel(d){S.wish.splice(+d.i,1);save();render()},
 noteDel(d){S.taste.notes.splice(+d.i,1);save();render()},
 ruleAdd(){const v=$("#rule").value.trim();if(!v)return;S.taste.rules.push(v);save();render();toast("Daran halte ich mich")},
 ruleDel(d){S.taste.rules.splice(+d.i,1);save();render()},
 distill(){distill(false)},
 month(d){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+ +d.d,1);render()},
 day(d){daySheet(d.k)},
 plan(d){S.plan[d.k]=d.id;save();render();daySheet(d.k)},
 unplan(d){delete S.plan[d.k];save();render();daySheet(d.k)},
 wearPlan(d){const o=S.outfits.find(x=>x.id===S.plan[d.k]);if(o){wear(o.items,o.name,d.k);delete S.plan[d.k];save()}render();daySheet(d.k)},
 settings(){confirmId=null;settingsSheet()},
 saveSettings(){S.settings.key=$("#s-key").value.trim();S.settings.model=$("#s-model").value.trim()||"claude-haiku-5-5";save();closeSheet();render();toast("Gespeichert");loadTrends()},
 async saveCity(){const v=$("#s-city").value.trim();if(!v){Object.assign(S.settings,{city:"",lat:null,lon:null});S.weather=null;save();closeSheet();render();return}
   try{await setCity(v);closeSheet();render();toast(wx()?"Wetter für "+S.settings.city+" geladen":"Ort gespeichert")}catch(e){toast("Den Ort finde ich gerade nicht")}},
 accent(d){S.settings.accent=d.n;save();applyAccent();settingsSheet()},
 async export(){const all=await DB.all();if(all.state)all.state={...all.state,settings:{...all.state.settings,key:""}};
   const blob=new Blob([JSON.stringify({app:"szafa-wiki",v:2,data:all})],{type:"application/json"}),name="szafa-wiki-sicherung-"+TODAY()+".json";
   try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==="AbortError")return}
   try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Sicherung erstellt")}catch(e){toast("Sichern geht in dieser Ansicht nicht")}},
 import(){$("#imp").click()},
 reset(){if(confirmId!=="reset"){confirmId="reset";return settingsSheet()}
   for(const k in U)delImg(k);const st=S.settings;S=fresh();S.settings={...st,onboarded:true,seen3:true};save();closeSheet();render();toast("Alles gelöscht")},
 alt(d){const dl=S.daily,i=+d.i,a=dl.alts[i];if(!a)return;dl.alts[i]=dl.items;Object.assign(dl,{items:a,title:"Look des Tages",rated:0,why:"",occ:"",tip:pick(TIPS)});save();render();window.scrollTo(0,0)},
 trendStyle(d){const x=S.trends&&S.trends.items[+d.i];if(!x)return;if(!hasAI())return aiError({code:"no_ai"});view="heute";render();window.scrollTo(0,0);const e=$("#occ");if(!e)return toast("Leg erst ein paar Teile in den Schrank");e.value="Trend: "+x.titel;A.askDaily()},
 trends(){loadTrends(true)},
 smartCutToggle(){S.settings.smartCut=S.settings.smartCut===false;save();settingsSheet()},
 trendsAuto(){S.settings.trendsAuto=S.settings.trendsAuto===false;save();settingsSheet()},
 tour(){tourStep=0;tourSheet()},
 tourNext(){if(tourStep<TOUR.length-1){tourStep++;tourSheet()}else A.tourEnd()},
 tourEnd(){S.settings.onboarded=true;S.settings.seen3=true;save();sheet("");render()}
};
function dropItems(ids){ids.forEach(id=>delImg(id));S.items=S.items.filter(i=>!ids.includes(i.id));
  S.outfits.forEach(o=>o.items=o.items.filter(x=>!ids.includes(x)));S.outfits=S.outfits.filter(o=>o.items.length);
  if(S.daily&&S.daily.items.some(x=>ids.includes(x)))S.daily=null;save()}
function applyAccent(){const a=ACCENTS[S.settings.accent]||ACCENTS.Beere,r=document.documentElement.style;r.setProperty("--acc",a[0]);r.setProperty("--acc-soft",a[1])}
document.addEventListener("click",ev=>{if(justDragged)return;const el=ev.target.closest("[data-act]");if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el.dataset,el,ev)});

/* ---------- Wischen auf der Tageskarte ---------- */
let drag=null;
document.addEventListener("pointerdown",e=>{const el=e.target.closest("#deck");if(el&&!busy)drag={el,x:e.clientX,y:e.clientY,dx:0,on:false}});
document.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){if(Math.abs(dx)<14||Math.abs(dx)<Math.abs(dy))return;drag.on=true;drag.el.style.transition="none"}
  drag.dx=dx;drag.el.style.transform=`translateX(${dx}px) rotate(${dx/24}deg)`;drag.el.dataset.sw=dx>50?"yes":dx<-50?"no":""});
function endDrag(){if(!drag)return;const d=drag;drag=null;if(!d.on)return;justDragged=true;setTimeout(()=>justDragged=false,60);
  d.el.style.transition="";d.el.style.transform="";d.el.dataset.sw="";if(d.dx>95)A.like();else if(d.dx<-95)A.dislike()}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);

/* ---------- Start ---------- */
async function boot(){
  for(const k in U){URL.revokeObjectURL(U[k]);delete U[k]}
  const all=await DB.all(),st=all.state,f=fresh();
  if(st)S={...f,...st,settings:{...f.settings,...(st.settings||{})},taste:{...f.taste,...(st.taste||{})}};
  else{S=f;S.settings.seen3=true;S.items=DEMO.map(([name,cat,color,se])=>({id:uid(),name,cat,color,season:se,style:"",price:0,wears:0,fav:false,wash:false,cut:false,demo:true}))}
  for(const k in all)if(k.indexOf("img:")===0)try{U[k.slice(4)]=URL.createObjectURL(d2b(all[k]))}catch(e){}
  let moved=false;S.items.forEach(i=>{if(i.img){setImg(i.id,i.img);moved=true}delete i.img});if(moved||!st)save();
  applyAccent();render();
  if(!S.settings.onboarded){tourStep=0;tourSheet()}else if(!S.settings.seen3)newsSheet();
  loadWeather();loadTrends();
}
(async()=>{
  render();await DB.open();await boot();
  try{sample=(window.claude&&window.claude.use)?await window.claude.use("sample"):null}catch(e){sample=null}
  if(sample&&!sheetOpen())render();
})();
</script>
